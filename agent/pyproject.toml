[project]
name = "medix-agent"
version = "0.1.0"
description = "Medix site agent: offline journal, sync, VSDC bridge, cold-chain monitoring."
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
medix-agent = "medix_agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["medix_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
